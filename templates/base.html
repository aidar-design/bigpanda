{% load static %}
<!DOCTYPE html>
<html lang="{{ LANG }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t.site.title }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=54">
</head>
<body>
    {% block content %}{% endblock %}
    <div class="lightbox" id="lightbox">
        <button class="lightbox__close" type="button" aria-label="{{ t.lightbox.close }}">&times;</button>
        <img id="lightbox-img" src="" alt="{{ t.lightbox.image_alt }}">
    </div>
    <script src="{% static 'js/main.js' %}?v=14"></script>
</body>
</html>
